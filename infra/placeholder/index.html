<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Watch</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f5; --fg: #1d2320; --muted: #5d6862; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1412; --fg: #e4ebe7; --muted: #93a19a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Earth Watch — first export pending</h1>
  <p>The first scheduled sweep and export haven't published yet. Check back within a few hours.</p>
</main>
</body>
</html>
